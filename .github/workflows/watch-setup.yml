name: Add Apple Watch target
on:
  push:
    branches: [main]
    paths: ['.github/watch-setup.rb', '.github/workflows/watch-setup.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  setup:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the target
        working-directory: app/ios/App
        run: |
          sudo gem install xcodeproj --no-document
          ruby ../../../.github/watch-setup.rb
      - name: Check it builds (phone + watch, unsigned)
        working-directory: app
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch || true
          npm ci
          node build.js
          npx cap sync ios
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -60
          test "${PIPESTATUS[0]}" = 0
          ls build/Build/Products/Release-iphoneos/App.app/Watch/
      - name: Commit the project change
        run: |
          git config user.name "Achilló build"
          git config user.email "noreply@github.com"
          git add app/ios/App/App.xcodeproj/project.pbxproj
          git commit -m "Add Apple Watch target" || exit 0
          git pull --rebase origin main
          git push
