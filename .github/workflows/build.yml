name: Compile check
# Releases go through Xcode Cloud → TestFlight. This only checks that the phone and watch apps still compile.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Web bundle
        working-directory: app
        run: |
          npm ci
          node build.js
          npx cap sync ios
      - name: Compile (unsigned)
        working-directory: app/ios/App
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -destination 'generic/platform=iOS' >/dev/null
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
